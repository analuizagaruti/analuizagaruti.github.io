<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Estudos · ADS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&family=Caveat:wght@500;600;700&family=Patrick+Hand&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --bg:#FBF5F0;
    --surface:#FFFFFF;
    --surface-soft:#FFF9F4;
    --border:#F0DED2;
    --text:#4E4038;
    --muted:#A9948A;

    --lav-bg:#E9DFF7; --lav-tx:#7C5FA8;
    --mint-bg:#D9F0E1; --mint-tx:#3F8F6D;
    --peach-bg:#FCE0C2; --peach-tx:#BE7434;
    --sky-bg:#D6E9F8; --sky-tx:#3E7CA6;
    --rose-bg:#FBD9E3; --rose-tx:#BD5678;
    --butter-bg:#FBF0C0; --butter-tx:#9C8A2E;
    --sage-bg:#DCE7D2; --sage-tx:#5F7C4A;
    --coral-bg:#FBDDD2; --coral-tx:#C0684B;

    --font-display:'Fredoka',sans-serif;
    --font-body:'Nunito',sans-serif;
    --font-alt:'Quicksand',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  #app{display:flex;min-height:600px;max-width:1220px;margin:0 auto;position:relative;}

  /* decorative pastel blobs */
  body::before, body::after{
    content:'';position:fixed;border-radius:50%;filter:blur(2px);z-index:-1;opacity:.5;
  }
  body::before{width:280px;height:280px;background:var(--lav-bg);top:-120px;right:-80px;}
  body::after{width:220px;height:220px;background:var(--mint-bg);bottom:-90px;left:-60px;}

  /* SIDEBAR */
  .sidebar{width:206px;flex-shrink:0;background:var(--surface);border-right:2px dashed var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;}
  .brand{font-family:var(--font-display);font-weight:600;font-size:17px;padding:4px 8px 4px;color:var(--text);}
  .brand small{display:block;font-family:var(--font-alt);font-weight:600;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.4px;}
  .nav{margin-top:20px;display:flex;flex-direction:column;gap:4px;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:none;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;transition:background .15s,color .15s,transform .1s;}
  .nav-btn:hover{background:var(--surface-soft);color:var(--text);transform:translateX(2px);}
  .nav-btn.active{background:var(--lav-bg);color:var(--lav-tx);}
  .nav-icon{width:18px;text-align:center;font-size:15px;}
  .sidebar-foot{margin-top:auto;padding:12px 10px;font-family:var(--font-alt);font-size:11px;color:var(--muted);border-top:2px dashed var(--border);line-height:1.6;}

  /* MAIN */
  .main{flex:1;padding:24px 28px 44px;min-width:0;}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
  .topbar h1{font-family:var(--font-display);font-weight:600;font-size:23px;margin:0;color:var(--text);}
  .topbar .date{font-family:var(--font-alt);font-weight:600;color:var(--muted);font-size:12.5px;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;box-shadow:0 4px 14px rgba(180,150,120,.07);}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;} #app{flex-direction:column;} .sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:2px dashed var(--border);align-items:center;}
    .brand{display:none;} .nav{flex-direction:row;margin-top:0;} .sidebar-foot{display:none;}}

  h2.section-title{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text);margin:0 0 12px;display:flex;align-items:center;gap:8px;}

  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .n{font-family:var(--font-display);font-size:28px;font-weight:600;}
  .stat .l{font-size:11.5px;color:var(--muted);font-weight:600;}

  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .task-title{font-size:13.5px;flex:1;min-width:0;font-weight:600;}
  .task-title.done{color:var(--muted);text-decoration:line-through;font-weight:400;}
  .pill{font-family:var(--font-alt);font-weight:700;font-size:10.5px;padding:3px 9px;border-radius:20px;background:var(--surface-soft);color:var(--muted);white-space:nowrap;}
  .pill.urgent{background:var(--rose-bg);color:var(--rose-tx);}
  .pill.soon{background:var(--peach-bg);color:var(--peach-tx);}

  /* subject chips */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip{font-family:var(--font-alt);font-weight:700;font-size:12px;padding:6px 14px;border-radius:20px;border:2px solid transparent;cursor:pointer;background:var(--surface-soft);color:var(--muted);}
  .chip.active{border-color:currentColor;}

  input,select,textarea{background:var(--surface-soft);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-family:var(--font-body);font-size:13px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lav-tx);}
  textarea{resize:vertical;min-height:80px;}
  label{font-size:11.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .btn{background:var(--lav-tx);color:#fff;border:none;padding:10px 16px;border-radius:12px;font-family:var(--font-body);font-weight:700;font-size:13px;cursor:pointer;}
  .btn:hover{opacity:.9;}
  .btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);}
  .btn.danger{background:transparent;border:1.5px solid var(--rose-tx);color:var(--rose-tx);padding:5px 10px;font-size:11.5px;font-weight:700;border-radius:10px;}
  .btn.small{padding:6px 12px;font-size:12px;border-radius:10px;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;}
  .icon-btn:hover{color:var(--rose-tx);}

  .form-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:16px;}
  @media(max-width:700px){.form-row{grid-template-columns:1fr;}}

  .empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:14px 0;}

  /* SUBJECT SECTIONS (repartições) */
  .subject-section{border-radius:18px;padding:16px 18px;margin-bottom:16px;border:1px solid var(--border);}
  .subject-section-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .subject-tab{font-family:var(--font-display);font-weight:600;font-size:14px;padding:4px 14px;border-radius:20px;}
  .subject-count{font-family:var(--font-alt);font-size:11px;color:var(--muted);font-weight:700;}

  /* TIMER */
  .timer-card{border-radius:24px;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;transition:background .4s;}
  .timer-ring{position:relative;width:210px;height:210px;}
  .timer-display{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .timer-time{font-family:var(--font-display);font-size:42px;font-weight:600;}
  .timer-mode{font-family:var(--font-alt);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:700;}
  .timer-controls{display:flex;gap:10px;}
  .timer-stats{display:flex;gap:26px;font-family:var(--font-alt);font-size:11.5px;color:var(--muted);font-weight:700;text-align:center;}
  .timer-stats b{display:block;color:var(--text);font-family:var(--font-display);font-size:16px;font-weight:600;}

  /* SCHEDULE */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;}
  .week-grid .h{font-family:var(--font-display);font-weight:600;color:var(--text);text-align:center;padding:4px 0;font-size:12.5px;}
  .week-cell{background:var(--surface-soft);border-radius:12px;min-height:54px;padding:6px;}
  .week-block{border-radius:9px;padding:4px 7px;font-size:10.5px;margin-bottom:4px;line-height:1.35;font-weight:700;}
  @media(max-width:820px){.week-grid{font-size:9px;grid-template-columns:repeat(7,minmax(60px,1fr));overflow-x:auto;} .week-block{font-size:8.5px;}}

  /* NOTES */
  .note-card{border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--border);}
  .note-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;flex-wrap:wrap;}
  .note-title{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .note-meta{font-family:var(--font-alt);font-size:10.5px;color:var(--muted);font-weight:700;}
  .note-content{font-size:14px;color:var(--text);white-space:pre-wrap;line-height:1.6;}

  /* SUBJECT (matérias) folder cards */
  .folder-card{border-radius:0 16px 16px 16px;padding:18px 18px 16px;position:relative;margin-top:14px;border:1px solid var(--border);}
  .folder-tab{position:absolute;top:-14px;left:0;font-family:var(--font-display);font-weight:600;font-size:12.5px;padding:5px 16px;border-radius:10px 10px 0 0;}
  .grade-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .grade-row:last-child{border-bottom:none;}
  .avg-box{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .avg-box .val{font-family:var(--font-display);font-size:19px;font-weight:600;}
  .avg-good{color:var(--mint-tx);} .avg-warn{color:var(--peach-tx);} .avg-bad{color:var(--rose-tx);}

  /* IMPORTAR */
  .dropzone{border:2.5px dashed var(--border);border-radius:16px;padding:22px;text-align:center;background:var(--surface-soft);cursor:pointer;transition:border-color .15s,background .15s;}
  .dropzone:hover, .dropzone.drag{border-color:var(--lav-tx);background:var(--lav-bg);}
  .dropzone .dz-icon{font-size:28px;margin-bottom:6px;}
  .dropzone .dz-text{font-weight:700;font-size:13px;}
  .dropzone .dz-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  #import-file{display:none;}
  .rec-dot{width:9px;height:9px;border-radius:50%;background:var(--rose-tx);display:inline-block;animation:pulse 1s infinite;margin-right:6px;}
  @keyframes pulse{50%{opacity:.3;}}
  .ai-tag{background:var(--lav-bg);color:var(--lav-tx);font-family:var(--font-alt);font-weight:700;font-size:9.5px;padding:2px 8px;border-radius:20px;margin-left:6px;}
  .status-line{font-size:12.5px;color:var(--muted);margin-top:10px;min-height:16px;}
  .status-line.ok{color:var(--mint-tx);font-weight:700;}
  .status-line.err{color:var(--rose-tx);font-weight:700;}

  /* RICH TEXT EDITOR (resumos) */
  .rte-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--surface-soft);border:1.5px solid var(--border);border-radius:10px 10px 0 0;padding:8px 10px;border-bottom:none;}
  .rte-toolbar button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--text);cursor:pointer;}
  .rte-toolbar button:hover{background:var(--lav-bg);}
  .rte-color-label{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;}
  .rte-color-label input[type=color]{width:20px;height:20px;padding:0;border:none;cursor:pointer;background:none;}
  .rte-editor{min-height:160px;max-height:340px;overflow-y:auto;background:var(--surface-soft);border:1.5px solid var(--border);border-radius:0 0 10px 10px;padding:12px 14px;font-family:var(--font-body);font-size:14px;color:var(--text);line-height:1.6;}
  .rte-editor:focus{outline:none;border-color:var(--lav-tx);}
  .rte-editor ul, .rte-editor ol{margin:6px 0;padding-left:22px;}
  .note-content ul, .note-content ol{margin:6px 0;padding-left:22px;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DAYS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const PRIORITY_LABEL = {alta:'Alta',media:'Média',baixa:'Baixa'};

/* pastel palette pairs: background + text tone, cycled per subject.
   Using raw hex (not CSS var()) so we can safely append alpha suffixes like `${bg}33` elsewhere.
   PALETTE_BASE holds the "identity" color the user picks for each slot; bg/tx are auto-derived
   so contrast always stays readable, then mirrored into the real CSS custom properties. */
const PALETTE_NAMES = ['lav','mint','peach','sky','rose','butter','sage','coral'];
const PALETTE_LABELS = ['Lavanda','Menta','Pêssego','Céu','Rosa','Manteiga','Sálvia','Coral'];
const DEFAULT_PALETTE_BASE = ['#7C5FA8','#3F8F6D','#BE7434','#3E7CA6','#BD5678','#9C8A2E','#5F7C4A','#C0684B'];
const DEFAULT_BG = '#FBF5F0';

function hexToRgb(hex){
  hex = (hex||'#000000').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');
}
function mixWithWhite(hex, amount){ const {r,g,b}=hexToRgb(hex); return rgbToHex(r+(255-r)*amount, g+(255-g)*amount, b+(255-b)*amount); }
function mixWithBlack(hex, amount){ const {r,g,b}=hexToRgb(hex); return rgbToHex(r*(1-amount), g*(1-amount), b*(1-amount)); }
function luminance(hex){ const {r,g,b}=hexToRgb(hex); return 0.299*r+0.587*g+0.114*b; }
function deriveBg(hex){ return mixWithWhite(hex, 0.85); }
function deriveTx(hex){ return luminance(hex) > 175 ? mixWithBlack(hex, 0.35) : hex; }

function buildPalette(base){
  return base.map((hex,i)=>({bg: deriveBg(hex), tx: deriveTx(hex), name: PALETTE_NAMES[i]}));
}
let PALETTE = buildPalette(DEFAULT_PALETTE_BASE);
const NEUTRAL = {bg:'#FFF9F4', tx:'#A9948A'};

function applyColorsToCSS(base, bg){
  const root = document.documentElement.style;
  PALETTE_NAMES.forEach((name,i)=>{
    root.setProperty(`--${name}-bg`, deriveBg(base[i]));
    root.setProperty(`--${name}-tx`, deriveTx(base[i]));
  });
  root.setProperty('--bg', bg || DEFAULT_BG);
}

/* font choices for resumos, each with css family + a comfortable size */
const NOTE_FONTS = {
  nunito:   {label:'Padrão',        family:"'Nunito',sans-serif",     size:'14px', weight:500},
  quicksand:{label:'Arredondada',   family:"'Quicksand',sans-serif",  size:'14.5px', weight:600},
  caveat:   {label:'Manuscrita',    family:"'Caveat',cursive",        size:'21px', weight:600},
  patrick:  {label:'Letra à mão',   family:"'Patrick Hand',cursive",  size:'17px', weight:400},
  kalam:    {label:'Kalam',         family:"'Kalam',cursive",         size:'16px', weight:400},
};

let state = null;
let currentTab = 'painel';
let subjectFilter = null; // used on tarefas/cronograma/resumos: null = todas, else subject name

const DEFAULT_STATE = {
  tasks: [
    {id:'t1', title:'Lista de exercícios — Estrutura de Dados', subject:'Estrutura de Dados', due: addDays(3), priority:'alta', done:false},
    {id:'t2', title:'Ler capítulo 4 — Banco de Dados', subject:'Banco de Dados', due: addDays(6), priority:'media', done:false},
  ],
  scheduleBlocks: [
    {id:'b1', day:0, start:'19:00', end:'21:00', subject:'Estrutura de Dados', activity:'Aula'},
    {id:'b2', day:2, start:'19:00', end:'21:00', subject:'Banco de Dados', activity:'Aula'},
    {id:'b3', day:4, start:'20:00', end:'22:00', subject:'Programação Orientada a Objetos', activity:'Aula'},
  ],
  subjects: [
    {id:'s1', name:'Estrutura de Dados', professor:'', paletteIdx:0, grades:[]},
    {id:'s2', name:'Banco de Dados', professor:'', paletteIdx:1, grades:[]},
    {id:'s3', name:'Programação Orientada a Objetos', professor:'', paletteIdx:2, grades:[]},
  ],
  notesList: [],
  timerLog: {},
  timerSettings: {focusMin:25, breakMin:5, longBreakMin:15, sessionsUntilLong:4},
  timerRuntime: {mode:'focus', secondsLeft:25*60, running:false, sessionsCompletedToday:0},
  customColorsBase: null, // null = usar as cores padrão; senão, array de 8 hex
  customBg: null,
  aiSettings: {provider:'anthropic', anthropicKey:'', openaiKey:'', openaiModel:'gpt-4o-mini', customUrl:'', customKey:'', customModel:''}
};

function addDays(n){
  const d = new Date();
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function todayKey(){ return new Date().toISOString().slice(0,10); }

async function loadState(){
  try{
    const res = await window.storage.get('study-app-data', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign({}, DEFAULT_STATE, parsed);
      state.timerRuntime = Object.assign({}, DEFAULT_STATE.timerRuntime, parsed.timerRuntime||{});
      state.timerRuntime.running = false;
      state.aiSettings = Object.assign({}, DEFAULT_STATE.aiSettings, parsed.aiSettings||{});
      state.subjects.forEach((s,i)=>{ if(s.paletteIdx===undefined) s.paletteIdx = i % PALETTE.length; });
    } else {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }catch(e){
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
  if(state.customColorsBase){
    PALETTE = buildPalette(state.customColorsBase);
    applyColorsToCSS(state.customColorsBase, state.customBg);
  }
  render();
}

let saveTimeout = null;
function saveState(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async ()=>{
    try{ await window.storage.set('study-app-data', JSON.stringify(state), false); }
    catch(e){ console.error('Erro ao salvar', e); }
  }, 250);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="sidebar">
      <div class="brand">📔 Painel de Estudos<small>ADS · 3º período</small></div>
      <div class="nav">
        ${navBtn('painel','🏠','Painel')}
        ${navBtn('tarefas','✅','Tarefas')}
        ${navBtn('cronograma','🗓️','Cronograma')}
        ${navBtn('timer','⏱️','Timer')}
        ${navBtn('materias','📚','Matérias')}
        ${navBtn('importar','📥','Importar aula')}
        ${navBtn('resumos','📝','Resumos')}
        ${navBtn('personalizar','🎨','Personalizar')}
      </div>
      <div class="sidebar-foot">seus dados são salvos<br>automaticamente ✨</div>
    </div>
    <div class="main" id="main"></div>
  `;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.onclick = ()=>{ currentTab = b.dataset.tab; subjectFilter=null; render(); };
  });
  renderMain();
}

function navBtn(tab, icon, label){
  return `<button class="nav-btn ${currentTab===tab?'active':''}" data-tab="${tab}"><span class="nav-icon">${icon}</span>${label}</button>`;
}

function renderMain(){
  const main = document.getElementById('main');
  if(currentTab==='painel') main.innerHTML = viewPainel();
  else if(currentTab==='tarefas') main.innerHTML = viewTarefas();
  else if(currentTab==='cronograma') main.innerHTML = viewCronograma();
  else if(currentTab==='timer') main.innerHTML = viewTimer();
  else if(currentTab==='materias') main.innerHTML = viewMaterias();
  else if(currentTab==='importar') main.innerHTML = viewImportar();
  else if(currentTab==='resumos') main.innerHTML = viewResumos();
  else if(currentTab==='personalizar') main.innerHTML = viewPersonalizar();
  attachHandlers();
}

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}
function daysUntil(iso){
  const d = new Date(iso+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function dueBadge(iso){
  const n = daysUntil(iso);
  if(n<0) return `<span class="pill urgent">atrasada</span>`;
  if(n===0) return `<span class="pill urgent">hoje</span>`;
  if(n<=2) return `<span class="pill soon">em ${n}d</span>`;
  return `<span class="pill">${fmtDate(iso)}</span>`;
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML;
}
function paletteFor(subjectName){
  const s = state.subjects.find(x=>x.name===subjectName);
  const idx = s ? s.paletteIdx : PALETTE.length-1;
  return PALETTE[idx % PALETTE.length];
}
function subjectAverages(){
  return state.subjects.map(s=>{
    if(s.grades.length===0) return {name:s.name, avg:null, status:''};
    const totalWeight = s.grades.reduce((a,g)=>a+(g.weight||1),0);
    const avg = s.grades.reduce((a,g)=>a+g.value*(g.weight||1),0)/totalWeight;
    const status = avg>=7?'avg-good':avg>=5?'avg-warn':'avg-bad';
    return {name:s.name, avg, status};
  });
}
function subjectChips(activeIsAll){
  return `<div class="chip-row">
    <button class="chip ${subjectFilter===null?'active':''}" data-filter-subject="" style="color:var(--text);">Todas</button>

/* ---------- TIMER ---------- */
function viewTimer(){
  const r = state.timerRuntime;
  const total = r.mode==='focus'?state.timerSettings.focusMin*60:(r.mode==='longbreak'?state.timerSettings.longBreakMin*60:state.timerSettings.breakMin*60);
  const pct = 1 - (r.secondsLeft/total);
  const circumference = 2*Math.PI*88;
  const dash = circumference*(1-pct);
  const mm = String(Math.floor(r.secondsLeft/60)).padStart(2,'0');
  const ss = String(r.secondsLeft%60).padStart(2,'0');
  const modeLabel = r.mode==='focus'?'Foco':(r.mode==='longbreak'?'Pausa longa':'Pausa');
  const bg = r.mode==='focus'?'var(--lav-bg)':(r.mode==='longbreak'?'var(--sky-bg)':'var(--peach-bg)');
  const ring = r.mode==='focus'?'var(--lav-tx)':(r.mode==='longbreak'?'var(--sky-tx)':'var(--peach-tx)');

  return `
    <div class="topbar"><h1>Timer de estudo</h1></div>
    <div class="grid grid-2">
      <div class="timer-card" style="background:${bg};">
        <div class="timer-ring">
          <svg width="210" height="210" viewBox="0 0 210 210">
            <circle cx="105" cy="105" r="88" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="12"/>
            <circle cx="105" cy="105" r="88" fill="none" stroke="${ring}" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dash}" transform="rotate(-90 105 105)"/>
          </svg>
          <div class="timer-display">
            <div class="timer-time" style="color:${ring};">${mm}:${ss}</div>
            <div class="timer-mode">${modeLabel}</div>
          </div>
        </div>
        <div class="timer-controls">
          <button class="btn" style="background:${ring};" id="timer-toggle">${r.running?'Pausar':'Iniciar'}</button>
          <button class="btn ghost" id="timer-reset">Reiniciar</button>
          <button class="btn ghost" id="timer-skip">Pular</button>
        </div>
        <div class="timer-stats">
          <div>sessões hoje<b>${state.timerLog[todayKey()]||0}</b></div>
          <div>foco<b>${state.timerSettings.focusMin}min</b></div>
          <div>pausa<b>${state.timerSettings.breakMin}min</b></div>
        </div>
      </div>
      <div class="card">
        <h2 class="section-title">⚙️ Configurações</h2>
        <div class="field"><label>Duração do foco (minutos)</label><input id="cfg-focus" type="number" min="5" max="120" value="${state.timerSettings.focusMin}"></div>
        <div class="field"><label>Duração da pausa curta (minutos)</label><input id="cfg-break" type="number" min="1" max="60" value="${state.timerSettings.breakMin}"></div>
        <div class="field"><label>Duração da pausa longa (minutos)</label><input id="cfg-longbreak" type="number" min="1" max="90" value="${state.timerSettings.longBreakMin}"></div>
        <div class="field"><label>Sessões até a pausa longa</label><input id="cfg-sessions" type="number" min="2" max="10" value="${state.timerSettings.sessionsUntilLong}"></div>
        <button class="btn ghost" id="save-timer-cfg">Salvar configurações</button>
        <p style="color:var(--muted);font-size:11.5px;margin-top:14px;">💡 Nos blocos de foco, deixe o celular de lado. Use as pausas para levantar, beber água e alongar.</p>
      </div>
    </div>
  `;
}

function tick(){
  const r = state.timerRuntime;
  if(!r.running) return;
  r.secondsLeft--;
  if(r.secondsLeft<=0){
    if(r.mode==='focus'){
      r.sessionsCompletedToday++;
      state.timerLog[todayKey()] = (state.timerLog[todayKey()]||0)+1;
      const isLong = r.sessionsCompletedToday % state.timerSettings.sessionsUntilLong === 0;
      r.mode = isLong?'longbreak':'break';
      r.secondsLeft = (isLong?state.timerSettings.longBreakMin:state.timerSettings.breakMin)*60;
    } else {
      r.mode = 'focus';
      r.secondsLeft = state.timerSettings.focusMin*60;
    }
    saveState();
  }
  if(currentTab==='timer') renderMain();
}
setInterval(tick, 1000);

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result.split(',')[1]);
    r.onerror = ()=>reject(new Error('Falha ao ler arquivo'));
    r.readAsDataURL(file);
  });
}
function fileToText(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(new Error('Falha ao ler arquivo'));
    r.readAsText(file);
  });
}

function parseAIJsonResponse(text){
  const clean = text.replace(/```json|```/g,'').trim();
  try{
    const parsed = JSON.parse(clean);
    if(parsed.titulo && parsed.resumo) return parsed;
  }catch(e){ /* fallback abaixo */ }
  return {titulo:'Resumo da aula', resumo: text || 'Não foi possível gerar o resumo. Tente novamente.'};
}

async function callAnthropic(content){
  const ai = state.aiSettings;
  const headers = {'Content-Type':'application/json'};
  if(ai.anthropicKey){
    headers['x-api-key'] = ai.anthropicKey;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers,
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens: 1000,
      messages:[{ role:'user', content }]
    })
  });
  const data = await response.json();
  if(!response.ok){
    const apiMsg = (data && data.error && data.error.message) ? data.error.message : `erro ${response.status}`;
    throw new Error(apiMsg);
  }
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  return parseAIJsonResponse(text);
}

function anthropicContentToOpenAI(content){
  const parts = [];
  for(const block of content){
    if(block.type === 'text') parts.push({type:'text', text: block.text});
    else if(block.type === 'image') parts.push({type:'image_url', image_url:{ url: `data:${block.source.media_type};base64,${block.source.data}` }});
    else if(block.type === 'document') throw new Error('PDFs só são suportados com o provedor Claude (Anthropic). Troque o provedor no painel acima ou envie o material em outro formato.');
  }
  return parts;
}

async function callOpenAICompatible(content, cfg){
  if(cfg.urlRequired && !cfg.url) throw new Error(cfg.keyRequiredMsg);
  if(!cfg.key) throw new Error(cfg.keyRequiredMsg);
  const parts = anthropicContentToOpenAI(content);
  const response = await fetch(cfg.url, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.key}`},
    body: JSON.stringify({ model: cfg.model, max_tokens: 1000, messages:[{ role:'user', content: parts }] })
  });
  const data = await response.json();
  if(!response.ok){
    const apiMsg = (data && data.error && data.error.message) ? data.error.message : `erro ${response.status}`;
    throw new Error(apiMsg);
  }
  const text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
  return parseAIJsonResponse(text);
}

async function callAIForSummary(content){
  const ai = state.aiSettings;
  if(ai.provider === 'openai'){
    return callOpenAICompatible(content, {
      url: 'https://api.openai.com/v1/chat/completions',
      key: ai.openaiKey,
      model: ai.openaiModel || 'gpt-4o-mini',
      keyRequiredMsg: 'Nenhuma chave de API da OpenAI configurada. Cole sua chave no painel "Provedor de IA" acima (crie uma em platform.openai.com).'
    });
  }
  if(ai.provider === 'custom'){
    return callOpenAICompatible(content, {
      url: ai.customUrl,
      key: ai.customKey,
      model: ai.customModel,
      urlRequired: true,
      keyRequiredMsg: 'Preencha a URL, a chave e o modelo do seu provedor personalizado no painel "Provedor de IA" acima.'
    });
  }
  return callAnthropic(content);
}

const SUMMARY_INSTRUCTION = 'Gere um título curto (máx. 8 palavras) e um resumo de aula bem organizado em tópicos, em português, cobrindo os conceitos principais do conteúdo acima. Responda SOMENTE em JSON, sem markdown ao redor, no formato exato: {"titulo":"...", "resumo":"..."}';

const SPEECH_ERROR_MESSAGES = {
  'not-allowed': 'Permissão de microfone negada ou bloqueada. Se você está dentro do Claude.ai, o navegador pode não permitir acesso ao microfone neste contexto — cole a transcrição manualmente abaixo.',
  'service-not-allowed': 'O serviço de reconhecimento de voz foi bloqueado neste ambiente. Use o campo de colar transcrição abaixo.',
  'audio-capture': 'Nenhum microfone foi encontrado neste dispositivo.',
  'network': 'Erro de rede durante a transcrição. Verifique sua conexão e tente novamente.',
  'aborted': null, // user or code stopped it on purpose, not a real error
  'no-speech': null // just silence, keep listening
};

function setImportStatus(msg, cls){
  const statusEl = document.getElementById('import-status');
  if(!statusEl) return;
  statusEl.textContent = msg;
  statusEl.className = 'status-line'+(cls?(' '+cls):'');
}

function startRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    setImportStatus('Seu navegador não tem suporte para gravação e transcrição ao vivo. Use a opção de colar transcrição.', 'err');
    return;
  }
  if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
    setImportStatus('A gravação só funciona em uma conexão segura (https). Use a opção de colar transcrição.', 'err');
    return;
  }
  const manualField = document.getElementById('import-manual-transcript');
  recordedTranscript = (manualField && manualField.value) || '';

  try{
    recognitionObj = new SR();
    recognitionObj.lang = 'pt-BR';
    recognitionObj.continuous = true;
    recognitionObj.interimResults = true;

    recognitionObj.onresult = (event)=>{
      let finalText = '';
      for(let i=event.resultIndex;i<event.results.length;i++){
        if(event.results[i].isFinal) finalText += event.results[i][0].transcript + ' ';
      }
      if(finalText){
        recordedTranscript += finalText;
        const ta = document.getElementById('import-manual-transcript');
        if(ta) ta.value = recordedTranscript;
      }
    };

    recognitionObj.onerror = (event)=>{
      const message = SPEECH_ERROR_MESSAGES.hasOwnProperty(event.error) ? SPEECH_ERROR_MESSAGES[event.error] : `Erro na gravação (${event.error}). Tente novamente ou cole a transcrição manualmente.`;
      if(message){
        stopRecording(message, true);
      }
      // null message (e.g. 'no-speech') is not fatal: keep listening, say nothing new
    };

    recognitionObj.onend = ()=>{
      // Some browsers auto-stop after a pause even with continuous=true.
      // If the user hasn't pressed "stop" and we didn't hit a fatal error, restart automatically.
      if(isRecording){
        try{ recognitionObj.start(); }
        catch(e){ stopRecording('A gravação foi interrompida pelo navegador. Cole a transcrição manualmente se precisar.', true); }
      }
    };

    recognitionObj.start();
    isRecording = true;
    const startBtn = document.getElementById('start-record-btn');
    const stopBtn = document.getElementById('stop-record-btn');
    if(startBtn) startBtn.style.display = 'none';
    if(stopBtn) stopBtn.style.display = 'inline-block';
    setImportStatus('Gravando... fale perto do microfone.', '');
  }catch(e){
    console.error(e);
    setImportStatus('Não foi possível iniciar a gravação neste navegador. Use a opção de colar transcrição.', 'err');
    isRecording = false;
  }
}

function stopRecording(message, isError){
  isRecording = false;
  if(recognitionObj){
    try{ recognitionObj.stop(); }catch(e){ /* already stopped */ }
  }
  const startBtn = document.getElementById('start-record-btn');
  const stopBtn = document.getElementById('stop-record-btn');
  if(stopBtn) stopBtn.style.display = 'none';
  if(startBtn) startBtn.style.display = 'inline-block';
  setImportStatus(message, isError?'err':'');
}

async function generateSummary(){
  const setStatus = setImportStatus;
  const genBtn = document.getElementById('generate-summary-btn');
  const manualTranscript = document.getElementById('import-manual-transcript').value.trim();

  if(genBtn){ genBtn.disabled = true; genBtn.style.opacity = '.6'; genBtn.style.cursor = 'wait'; }
  try{
    let content;
    if(importFile){
      const name = importFile.name.toLowerCase();
      setStatus('Lendo arquivo...');
      if(name.endsWith('.pdf')){
        const base64 = await fileToBase64(importFile);
        content = [
          {type:'document', source:{type:'base64', media_type:'application/pdf', data:base64}},
          {type:'text', text: 'Este é um material de aula em PDF (slides ou apostila). '+SUMMARY_INSTRUCTION}
        ];
      } else if(name.match(/\.(jpg|jpeg|png|webp)$/)){
        const base64 = await fileToBase64(importFile);
        content = [
          {type:'image', source:{type:'base64', media_type:importFile.type||'image/jpeg', data:base64}},
          {type:'text', text: 'Esta imagem é um slide ou anotação de aula. '+SUMMARY_INSTRUCTION}
        ];
      } else if(name.endsWith('.docx')){
        if(typeof mammoth === 'undefined') throw new Error('Biblioteca de leitura de .docx não carregou. Tente novamente.');
        const buffer = await importFile.arrayBuffer();
        const result = await mammoth.extractRawText({arrayBuffer:buffer});
        content = [{type:'text', text: 'Conteúdo de um documento de aula:\n\n'+result.value+'\n\n'+SUMMARY_INSTRUCTION}];
      } else {
        const text = await fileToText(importFile);
        content = [{type:'text', text: 'Conteúdo de uma anotação de aula:\n\n'+text+'\n\n'+SUMMARY_INSTRUCTION}];
      }
    } else if(manualTranscript){
      content = [{type:'text', text: 'Transcrição de uma aula em áudio/vídeo:\n\n'+manualTranscript+'\n\n'+SUMMARY_INSTRUCTION}];
    } else {
      setStatus('Envie um arquivo, grave uma aula ou cole uma transcrição primeiro.', 'err');
      return;
    }

    setStatus('Gerando resumo com IA...');
    const {titulo, resumo} = await callAIForSummary(content);

    document.getElementById('preview-title').value = titulo;
    document.getElementById('preview-content').value = resumo;
    document.getElementById('import-preview-card').style.display = 'block';
    setStatus('Pronto! Revise o resumo abaixo antes de salvar.', 'ok');
  }catch(e){
    console.error(e);
    setStatus('Não foi possível gerar o resumo: '+(e.message||'erro desconhecido')+'. Tente novamente.', 'err');
  }finally{
    if(genBtn){ genBtn.disabled = false; genBtn.style.opacity = ''; genBtn.style.cursor = ''; }
  }
}

function sanitizeHtml(html){
  const div = document.createElement('div');
  div.innerHTML = html || '';
  div.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(el=>el.remove());
  div.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(attr=>{
      const name = attr.name.toLowerCase();
      if(name.startsWith('on')){ el.removeAttribute(attr.name); return; }
      if(name==='href' && attr.value.trim().toLowerCase().startsWith('javascript:')){ el.removeAttribute(attr.name); return; }
      if(name==='style'){
        const safe = attr.value.split(';').filter(rule=>/^\s*(color|background-color)\s*:/i.test(rule)).join(';');
        if(safe) el.setAttribute('style', safe); else el.removeAttribute('style');
      }
    });
  });
  return div.innerHTML;
}

function textToHtml(text){

function attachHandlers(){

  };

    el.onclick = ()=>{ state.scheduleBlocks = state.scheduleBlocks.filter(x=>x.id!==el.dataset.delBlock); saveState(); renderMain(); };

  if(timerToggle) timerToggle.onclick = ()=>{ state.timerRuntime.running = !state.timerRuntime.running; saveState(); renderMain(); };
  const timerReset = document.getElementById('timer-reset');
  if(timerReset) timerReset.onclick = ()=>{
    const r = state.timerRuntime;
    r.running = false;
    r.secondsLeft = (r.mode==='focus'?state.timerSettings.focusMin:(r.mode==='longbreak'?state.timerSettings.longBreakMin:state.timerSettings.breakMin))*60;
    saveState(); renderMain();
  };
  const timerSkip = document.getElementById('timer-skip');
  if(timerSkip) timerSkip.onclick = ()=>{
    const r = state.timerRuntime;
    if(r.mode==='focus'){ r.mode='break'; r.secondsLeft = state.timerSettings.breakMin*60; }
    else { r.mode='focus'; r.secondsLeft = state.timerSettings.focusMin*60; }
    saveState(); renderMain();
  };
  const saveCfg = document.getElementById('save-timer-cfg');
  if(saveCfg) saveCfg.onclick = ()=>{
    state.timerSettings.focusMin = parseInt(document.getElementById('cfg-focus').value)||25;
    state.timerSettings.breakMin = parseInt(document.getElementById('cfg-break').value)||5;
    state.timerSettings.longBreakMin = parseInt(document.getElementById('cfg-longbreak').value)||15;
    state.timerSettings.sessionsUntilLong = parseInt(document.getElementById('cfg-sessions').value)||4;
    if(!state.timerRuntime.running && state.timerRuntime.mode==='focus'){
      state.timerRuntime.secondsLeft = state.timerSettings.focusMin*60;
    }

  };

  });

  // PROVEDOR DE IA
  const aiProviderSelect = document.getElementById('ai-provider-select');
  if(aiProviderSelect) aiProviderSelect.onchange = ()=>{
    state.aiSettings.provider = aiProviderSelect.value;
    renderMain();
  };
  const saveAiBtn = document.getElementById('save-ai-settings-btn');
  if(saveAiBtn) saveAiBtn.onclick = ()=>{
    const ai = state.aiSettings;
    if(ai.provider === 'openai'){
      ai.openaiKey = (document.getElementById('ai-openai-key')||{}).value?.trim() || '';
      ai.openaiModel = (document.getElementById('ai-openai-model')||{}).value?.trim() || 'gpt-4o-mini';
    } else if(ai.provider === 'custom'){
      ai.customUrl = (document.getElementById('ai-custom-url')||{}).value?.trim() || '';
      ai.customKey = (document.getElementById('ai-custom-key')||{}).value?.trim() || '';
      ai.customModel = (document.getElementById('ai-custom-model')||{}).value?.trim() || '';
    } else {
      ai.anthropicKey = (document.getElementById('ai-anthropic-key')||{}).value?.trim() || '';
    }
    saveState();
    const statusEl = document.getElementById('ai-settings-status');
    if(statusEl){ statusEl.textContent = 'Configuração de IA salva.'; statusEl.className = 'status-line ok'; }
  };

  // IMPORTAR AULA
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('import-file');
  if(dropzone && fileInput){
    dropzone.onclick = ()=> fileInput.click();
    dropzone.ondragover = (e)=>{ e.preventDefault(); dropzone.classList.add('drag'); };
    dropzone.ondragleave = ()=> dropzone.classList.remove('drag');
    dropzone.ondrop = (e)=>{
      e.preventDefault(); dropzone.classList.remove('drag');
      if(e.dataTransfer.files.length){ importFile = e.dataTransfer.files[0]; document.getElementById('dropzone-text').textContent = importFile.name; }
    };
    fileInput.onchange = ()=>{
      if(fileInput.files.length){ importFile = fileInput.files[0]; document.getElementById('dropzone-text').textContent = importFile.name; }
    };
  }
  const startRecordBtn = document.getElementById('start-record-btn');
  const stopRecordBtn = document.getElementById('stop-record-btn');
  if(startRecordBtn) startRecordBtn.onclick = ()=> startRecording();
  if(stopRecordBtn) stopRecordBtn.onclick = ()=> stopRecording('Gravação parada. Revise o texto e gere o resumo.', false);
  const manualTranscriptField = document.getElementById('import-manual-transcript');
  if(manualTranscriptField) manualTranscriptField.oninput = ()=>{ recordedTranscript = manualTranscriptField.value; };
  const generateBtn = document.getElementById('generate-summary-btn');
  if(generateBtn) generateBtn.onclick = generateSummary;
  const savePreviewBtn = document.getElementById('save-preview-btn');
  if(savePreviewBtn) savePreviewBtn.onclick = ()=>{
    const title = document.getElementById('preview-title').value.trim();
    const content = document.getElementById('preview-content').value.trim();
    const subject = document.getElementById('import-subject').value.trim();
    if(!title || !content) return;
    state.notesList.push({id:uid(), subject, title, content: textToHtml(content), font:'nunito', source:'ia', date:todayKey()});
    saveState();
    importFile = null; recordedTranscript = '';
    currentTab = 'resumos'; subjectFilter = null;
    render();
  };

  // Toolbar do editor de resumos (negrito, itálico, sublinhado, listas, cores)
  document.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.preventDefault();
      const ed = document.getElementById('editor-content');
      if(!ed) return;
      ed.focus();
      document.execCommand(btn.dataset.cmd, false, null);
    };
  });
  const rteColor = document.getElementById('rte-color');
  if(rteColor) rteColor.oninput = ()=>{
    const ed = document.getElementById('editor-content');
    if(!ed) return;
    ed.focus();
    document.execCommand('foreColor', false, rteColor.value);
  };
  const rteHighlight = document.getElementById('rte-highlight');
  if(rteHighlight) rteHighlight.oninput = ()=>{
    const ed = document.getElementById('editor-content');
    if(!ed) return;
    ed.focus();
    try{ document.execCommand('hiliteColor', false, rteHighlight.value); }
    catch(e){ document.execCommand('backColor', false, rteHighlight.value); }
  };
  const rteClear = document.getElementById('rte-clear');
  if(rteClear) rteClear.onclick = ()=>{
    const ed = document.getElementById('editor-content');
    if(!ed) return;
    ed.focus();
    document.execCommand('removeFormat', false, null);
  };

  const addNoteBtn = document.getElementById('add-note-btn');
  if(addNoteBtn) addNoteBtn.onclick = ()=>{
    const subject = document.getElementById('new-note-subject').value.trim();
    const title = document.getElementById('new-note-title').value.trim();
    const editorEl = document.getElementById('editor-content');
    const content = sanitizeHtml(editorEl ? editorEl.innerHTML.trim() : '');
    const font = document.getElementById('new-note-font').value;
    const plainText = editorEl ? editorEl.textContent.trim() : '';
    if(!title || !plainText) return;
    if(editingNoteId){
      const n = state.notesList.find(x=>x.id===editingNoteId);
      if(n){ n.subject = subject; n.title = title; n.content = content; n.font = font; }
      editingNoteId = null;
    } else {
      state.notesList.push({id:uid(), subject, title, content, font, date:todayKey()});
    }
    saveState(); renderMain();
  };
  const cancelEditBtn = document.getElementById('cancel-edit-btn');
  if(cancelEditBtn) cancelEditBtn.onclick = ()=>{ editingNoteId = null; renderMain(); };
  document.querySelectorAll('[data-edit-note]').forEach(el=>{
    el.onclick = ()=>{ editingNoteId = el.dataset.editNote; renderMain(); };
  });
  document.querySelectorAll('[data-del-note]').forEach(el=>{
    el.onclick = ()=>{
      state.notesList = state.notesList.filter(x=>x.id!==el.dataset.delNote);
      if(editingNoteId === el.dataset.delNote) editingNoteId = null;
      saveState(); renderMain();
    };
  });
}

loadState();
</script>
</body>
</html>
